# Xcode project for the iPhone test version; created on the Mac build machine with XcodeGen
# (see .github/workflows/ios.yml), so no .xcodeproj has to be kept in the repository.
name: RemoteMC
options:
  bundleIdPrefix: de.remotemc
  deploymentTarget:
    iOS: "17.0"
targets:
  RemoteMC:
    type: application
    platform: iOS
    sources: [RemoteMC]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.remotemc.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemoteMC/Info.plist
        CODE_SIGNING_ALLOWED: NO
