name: iOS test version

# Builds the small iPhone test version (ios-app/) on a Mac. Runs only when the iPhone app changes
# or on request ("Run workflow"); public repositories pay nothing for the Mac.
# The result is an unsigned .ipa – install it with Sideloadly or AltStore and your Apple ID.
on:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Apple-silicon Macs (macos-latest) are often short on GitHub; the Intel ones are free sooner.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode (iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Create the Xcode project
        run: |
          brew install xcodegen
          cd ios-app && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios-app
          xcodebuild -project RemoteMC.xcodeproj -scheme RemoteMC -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          cd ios-app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RemoteMC.app Payload/
          zip -qry RemoteMC-iOS-test.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteMC-iOS-test
          path: ios-app/RemoteMC-iOS-test.ipa
