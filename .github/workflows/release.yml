name: Release

# Push a tag like v1.0.0 to publish the plugin, the Android app and the Windows app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional: set these secrets/variables to also publish the plugin there.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build plugin
        working-directory: plugin
        run: mvn -B package -Drevision="${GITHUB_REF_NAME#v}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build app (signed when the keystore secrets are set)
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.RMC_KEYSTORE_BASE64 }}
          RMC_KEYSTORE_PASSWORD: ${{ secrets.RMC_KEYSTORE_PASSWORD }}
          RMC_KEY_ALIAS: ${{ secrets.RMC_KEY_ALIAS }}
          RMC_KEY_PASSWORD: ${{ secrets.RMC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RMC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing secrets set – the APK is signed with a debug key."
          fi
          ./gradlew assembleGithubRelease bundlePlayRelease -Prmc.version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "../RemoteMC-App-${GITHUB_REF_NAME#v}.apk"
          # Google Play version as app bundle (upload it in the Play Console; not attached to the release).
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../RemoteMC-App-Play-${GITHUB_REF_NAME#v}.aab"

      - name: Keep the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMC-App-Play
          path: RemoteMC-App-Play-*.aab

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            plugin/target/RemoteMC-*.jar
            RemoteMC-App-*.apk

      - name: Publish plugin to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: plugin/target/RemoteMC-*.jar
          loaders: paper purpur folia spigot bukkit
          game-versions: ">=1.20.6"
          version: ${{ github.ref_name }}
          changelog-file: CHANGELOG.md

      - name: Publish plugin to Hangar
        if: ${{ env.HANGAR_TOKEN != '' }}
        env:
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JWT=$(curl -sf -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_TOKEN" | jq -r .token)
          JAR=$(ls plugin/target/RemoteMC-*.jar | grep -v original)
          jq -n --arg v "$VERSION" '{version: $v, channel: "Release", description: "See GitHub release notes",
            files: [{platforms: ["PAPER"]}], pluginDependencies: {}, platformDependencies: {PAPER: ["1.20.6-1.21.11"]}}' > meta.json
          curl -sf -X POST "https://hangar.papermc.io/api/v1/projects/$HANGAR_PROJECT/upload" \
            -H "Authorization: $JWT" \
            -F "versionUpload=@meta.json;type=application/json" \
            -F "files=@$JAR"

  desktop-windows:
    # Windows installers for the same release (jpackage only builds them on Windows).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # JetBrains Runtime: the installer ships it, so the window keeps Windows' own frame
          # (native dragging, snapping and animations) with RemoteMC's tabs in the title bar.
          distribution: jetbrains
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Installers
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./gradlew packageMsi packageExe packageUberJarForCurrentOS -Prmc.version="$V"
          mkdir -p out
          cp build/compose/binaries/main/msi/*.msi "out/RemoteMC-Windows-$V.msi"
          cp build/compose/binaries/main/exe/*.exe "out/RemoteMC-Windows-$V-Setup.exe"
          cp build/compose/jars/*.jar "out/RemoteMC-Windows-$V-portable.jar"
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop-app/out/*

