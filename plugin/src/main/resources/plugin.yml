name: RemoteMC
version: '${project.version}'
main: de.remotemc.plugin.RemoteMCPlugin
api-version: '1.20'
folia-supported: true
description: Manage your server from your phone with the RemoteMC app
website: https://github.com/michig-code/main
commands:
  remotemc:
    description: Pair the RemoteMC app and manage access
    aliases: [rmc]
    usage: /remotemc <pair|info|token|reload>
    permission: remotemc.admin
permissions:
  remotemc.admin:
    description: Pair devices, manage tokens and view connection info
    default: op
