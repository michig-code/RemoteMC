name: RemoteMC
version: '${project.version}'
main: de.remotemc.plugin.RemoteMCPlugin
api-version: '1.21'
description: REST API for the RemoteMC Android app
commands:
  remotemc:
    description: RemoteMC connection info and management
    aliases: [rmc]
    usage: /remotemc <info|link|newtoken|reload>
    permission: remotemc.admin
permissions:
  remotemc.admin:
    description: Manage RemoteMC and view the access token
    default: op
