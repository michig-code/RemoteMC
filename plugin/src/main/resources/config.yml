# ─────────────────────────────────────────────────────────────
#  RemoteMC – control your server from the RemoteMC app
#  Docs: https://github.com/michig-code/RemoteMC
# ─────────────────────────────────────────────────────────────

# Language of plugin messages: en, de, es, fr, it, nl, pl, pt-BR, tr, ru
language: en

api:
  # Interface to listen on (0.0.0.0 = all interfaces).
  host: 0.0.0.0
  # Port of the RemoteMC API. Open it in your firewall / router or
  # use one of the extra ports your hosting provider gives you.
  port: 8765
  # Address shown in pairing QR codes and links (domain or public IP).
  # Empty = server-ip from server.properties.
  public-address: ""
  # Built-in encryption (HTTPS) with a self-signed certificate.
  # The app trusts it via the fingerprint inside the pairing QR code.
  # Only disable this if a reverse proxy in front of RemoteMC handles HTTPS.
  tls: true

security:
  # Invalid tokens / pairing codes before an IP address is locked out ...
  max-failed-attempts: 5
  # ... for this many seconds.
  lockout-seconds: 300
  # How long a pairing code from /remotemc pair stays valid.
  pairing-code-minutes: 5
  # Allow admin devices to run console commands.
  allow-commands: true
  # Commands that can never be run from the app (label only, without "/").
  blocked-commands:
    - stop
    - restart

console:
  # Console lines kept in memory for the app.
  buffer-size: 500

# Log every action performed through the app to plugins/RemoteMC/audit.log
audit-log: true

# Tell admins on join when a new RemoteMC version is available.
update-check: true
