# ─────────────────────────────────────────────────────────────
#  RemoteMC – Verbindung zwischen Server und Android-App
# ─────────────────────────────────────────────────────────────

api:
  # Interface, auf dem der HTTP-Server lauscht (0.0.0.0 = alle).
  host: 0.0.0.0
  # Port der API. Muss in Firewall / Router freigegeben werden,
  # wenn du von außerhalb deines Netzwerks verbinden willst.
  port: 8765
  # Adresse, die in "/remotemc link" angezeigt wird (z.B. deine
  # Domain oder öffentliche IP). Leer = Server-IP aus server.properties.
  public-address: ""
  # Zugangs-Token. Leer lassen -> wird beim Start automatisch erzeugt
  # und hier gespeichert. Mit "/remotemc newtoken" neu erzeugen.
  token: ""

security:
  # Nach so vielen falschen Tokens wird die IP gesperrt ...
  max-failed-attempts: 5
  # ... für so viele Sekunden.
  lockout-seconds: 300
  # Darf die App Konsolenbefehle ausführen?
  allow-commands: true
  # Befehle, die über die App NICHT ausgeführt werden dürfen
  # (nur der erste Teil des Befehls, ohne "/").
  blocked-commands:
    - stop
    - restart

console:
  # Wie viele Konsolenzeilen für die App zwischengespeichert werden.
  buffer-size: 500
